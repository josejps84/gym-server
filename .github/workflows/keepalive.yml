# Supabase's free plan pauses a project after 7 days without activity. /health runs a query,
# which is enough to keep it awake while there are no real users yet.
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - run: curl --fail --silent --show-error --retry 3 --max-time 30 "${{ vars.API_URL }}/health"
